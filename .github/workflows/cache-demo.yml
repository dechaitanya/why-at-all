name: Cache Demo

on: [push]  # Triggers on any push to any branch

jobs:
  demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Populate cache dir
      run: mkdir -p ~/.cache/demo && echo "dummy" > ~/.cache/demo/file.txt
      
    - name: prime-cache-be3ebbe  # Exact step name required
      uses: actions/cache@v4     # Latest version as specified
      with:
        key: cache-be3ebbe       # Exact key required
        path: ~/.cache            # Caches a dummy folder (GitHub pre-creates this)
